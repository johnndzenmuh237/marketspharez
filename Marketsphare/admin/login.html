<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Marketsphare</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-body);padding:20px;margin:0}
.box{width:100%;max-width:400px;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-color);border-radius:16px;padding:28px;box-shadow:var(--shadow-lg)}
.box h1{margin:0 0 4px;font-size:22px}.box p{margin:0 0 18px;color:var(--text-secondary);font-size:13.5px}
.f{margin-bottom:14px}.f label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:5px}
.f input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface);color:var(--text-primary);font-size:14px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--color-primary);color:#fff;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.6}
#msg{font-size:13px;margin:0 0 12px;min-height:18px;color:#c23b3b;overflow-wrap:anywhere}#msg.ok{color:#1a9e6b}
.back{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--text-secondary)}
</style></head><body>
<div class="box"><h1>Admin Login</h1><p>Sign in with an admin account to review withdrawals, KYC and upgrades.</p>
<div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
<div class="f"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
<div id="msg"></div><button id="go">Sign in as admin</button>
<a class="back" href="../auth/login.html">Regular user login</a></div>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/api-config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id), API = (window.MS_API || "").replace(/\/$/, "");
  const say = (t, ok) => { $("msg").textContent = t; $("msg").className = ok ? "ok" : ""; };
  async function check(user) {
    if (!user.emailVerified) throw new Error("This account's email is not verified yet. Verify it first, then sign in again.");
    const token = await user.getIdToken();
    const r = await fetch(API + "/api/admin/ping", { headers: { Authorization: "Bearer " + token } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 403) throw new Error("This email (" + user.email + ") is not in ADMIN_EMAILS on the server. Add it in Render → Environment, save, and wait for the redeploy.");
      throw new Error(j.error || "Could not reach the server.");
    }
  }
  async function enter(user) { await check(user); say("Welcome — opening the admin dashboard…", true); location.href = "dashboard.html"; }
  $("go").onclick = async () => {
    const email = $("em").value.trim(), pw = $("pw").value; if (!email || !pw) return say("Enter your email and password.");
    $("go").disabled = true; say("Signing in…", true);
    try {
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      const c = await auth.signInWithEmailAndPassword(email, pw); await enter(c.user);
    } catch (e) {
      const code = e && e.code || "";
      say(/wrong-password|invalid-credential|user-not-found/.test(code) ? "Wrong email or password." : (e.message || "Sign-in failed."));
      $("go").disabled = false;
    }
  };
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
  auth.onAuthStateChanged((u) => { if (u && !$("go").disabled) { $("go").disabled = true; enter(u).catch((e) => { say(e.message); $("go").disabled = false; }); } });
})();
</script></body></html>
